services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: reza
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reza -d reza"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://reza:${POSTGRES_PASSWORD}@database:5432/reza
    depends_on:
      database:
        condition: service_healthy

  api:
    build: .
    command: ["npm", "start"]
    environment:
      NODE_ENV: development
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DATABASE_URL: postgresql://reza:${POSTGRES_PASSWORD}@database:5432/reza
      ALLOWED_DOMAINS: example.com
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    environment:
      NODE_ENV: development
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DATABASE_URL: postgresql://reza:${POSTGRES_PASSWORD}@database:5432/reza
      ALLOWED_DOMAINS: example.com
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_data:
